<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — MediAI</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="auth-page">
  <div class="auth-container">
    <div class="auth-left">
      <div class="auth-brand">Medi<span>AI</span></div>
      <h1>Welcome back</h1>
      <p>Sign in to manage appointments, check symptoms, and access your health dashboard.</p>
      <div class="auth-features">
        <div class="auth-feat"><span>🧠</span> AI Symptom Checker</div>
        <div class="auth-feat"><span>📅</span> Smart Scheduling</div>
        <div class="auth-feat"><span>🚨</span> Emergency Alerts</div>
      </div>
    </div>
    <div class="auth-right">
      <div class="auth-card">
        <h2>Sign In</h2>
        <p class="auth-sub">Don't have an account? <a href="{{ url_for('register') }}">Register here</a></p>

        {% if error %}
        <div class="alert alert-error">{{ error }}</div>
        {% endif %}

        <form method="POST" action="{{ url_for('login') }}">
          <div class="form-group">
            <label>Email Address</label>
            <input type="email" name="email" placeholder="you@example.com" required>
          </div>
          <div class="form-group">
            <label>Password</label>
            <input type="password" name="password" placeholder="••••••••" required>
          </div>
          <button type="submit" class="btn btn-primary btn-full">Sign In</button>
        </form>

        <div class="auth-demo">
          <p>Demo credentials: <code>demo@mediai.com</code> / <code>demo123</code></p>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
