<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register — MediAI</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="auth-page">
  <div class="auth-container">
    <div class="auth-left">
      <div class="auth-brand">Medi<span>AI</span></div>
      <h1>Join MediAI</h1>
      <p>Create your account and experience AI-powered healthcare management.</p>
      <div class="auth-features">
        <div class="auth-feat"><span>✅</span> Free to register</div>
        <div class="auth-feat"><span>🔒</span> Secure & private</div>
        <div class="auth-feat"><span>⚡</span> Instant access</div>
      </div>
    </div>
    <div class="auth-right">
      <div class="auth-card">
        <h2>Create Account</h2>
        <p class="auth-sub">Already have an account? <a href="{{ url_for('login') }}">Sign in</a></p>

        {% if error %}
        <div class="alert alert-error">{{ error }}</div>
        {% endif %}

        <form method="POST" action="{{ url_for('register') }}">
          <div class="form-row">
            <div class="form-group">
              <label>Full Name</label>
              <input type="text" name="name" placeholder="John Doe" required>
            </div>
            <div class="form-group">
              <label>Age</label>
              <input type="number" name="age" placeholder="25" min="1" max="120">
            </div>
          </div>
          <div class="form-group">
            <label>Email Address</label>
            <input type="email" name="email" placeholder="you@example.com" required>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label>Phone Number</label>
              <input type="tel" name="phone" placeholder="+91 9876543210">
            </div>
            <div class="form-group">
              <label>Gender</label>
              <select name="gender">
                <option value="">Select</option>
                <option value="Male">Male</option>
                <option value="Female">Female</option>
                <option value="Other">Other</option>
              </select>
            </div>
          </div>
          <div class="form-group">
            <label>Password</label>
            <input type="password" name="password" placeholder="Min. 6 characters" required minlength="6">
          </div>
          <button type="submit" class="btn btn-primary btn-full">Create Account</button>
        </form>
      </div>
    </div>
  </div>
</body>
</html>
